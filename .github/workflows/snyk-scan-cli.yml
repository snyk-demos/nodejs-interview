name: Snyk Scans (CI only)

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning
  actions: read            # required for SARIF upload on private repos

concurrency:
  group: snyk-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sca:
    name: SCA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0   
      - uses: snyk-demos/snyk-scan-templates/sca@v1
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          pr-comment: false
          # monitor stays "false": the SCM integration owns the Snyk UI side.

  code:
    name: Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: snyk-demos/snyk-scan-templates/code@v1
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          pr-comment: false

  iac:
    name: IaC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: snyk-demos/snyk-scan-templates/iac@v1
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          pr-comment: false
