name: Snyk Scans

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, master]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read          # actions/checkout
  pull-requests: write    # sticky PR comment via gh api
  security-events: write  # upload-sarif
  actions: read
concurrency:
  group: snyk-${{ github.event.pull_request.number || github.ref_name }}
  # Never cancel a default-branch, as those produce the code scanning baseline.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  sca:
    name: SCA
    # Fork PRs get no secrets, so we skip those.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # install-command defaults to "auto". Override with "dotnet restore", "make deps", or "skip".
      - uses: snyk-demos/snyk-scan-templates/sca@v1
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          monitor: ${{ github.event_name == 'push' }}
          target-reference: auto
          project-tags: app=${{ github.event.repository.name }}
          # project-name auto-detects the manifest filename.
  code:
    name: Code
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # --report needs "View Project Ignores" on the token's role, or 403.
      - uses: snyk-demos/snyk-scan-templates/code@v1
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          monitor: ${{ github.event_name == 'push' }}
          target-reference: auto
          project-tags: app=${{ github.event.repository.name }}
  iac:
    name: IaC
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: snyk-demos/snyk-scan-templates/iac@v1
        with:
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          monitor: ${{ github.event_name == 'push' }}
          target-reference: auto
          project-tags: app=${{ github.event.repository.name }}
